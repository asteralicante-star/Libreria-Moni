<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Degradado principal del fondo (60% Azul petróleo #086288) -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a7aa7"/>
      <stop offset="60%" stop-color="#086288"/>
      <stop offset="100%" stop-color="#032d3f"/>
    </linearGradient>

    <!-- Degradado del marcapáginas (30% Terracota #DE7272) -->
    <linearGradient id="ribbonGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f29595"/>
      <stop offset="100%" stop-color="#DE7272"/>
    </linearGradient>

    <!-- Degradado de la estrella / destello (10% Verde salvia #5C7057) -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#809c7a"/>
      <stop offset="100%" stop-color="#5C7057"/>
    </linearGradient>

    <!-- Sombra suave para dar volumen editorial -->
    <filter id="bookShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#021a24" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Fondo: Cuadrado con esquinas redondeadas estilo app icon -->
  <rect width="512" height="512" rx="128" fill="url(#bgGradient)"/>
  
  <!-- Borde decorativo interior muy sutil -->
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.18"/>

  <!-- Grupo del Libro Abierto (Moni Books) -->
  <g filter="url(#bookShadow)" transform="translate(0, 15)">
    <!-- Páginas base del libro (Blanco puro / contraste editorial) -->
    <!-- Página izquierda -->
    <path d="M 256 360 C 205 342 140 338 90 354 C 82 356 74 350 74 340 L 74 182 C 74 174 81 168 89 166 C 142 152 208 156 256 182 Z" 
          fill="#FFFFFF" />

    <!-- Página derecha -->
    <path d="M 256 360 C 307 342 372 338 422 354 C 430 356 438 350 438 340 L 438 182 C 438 174 431 168 423 166 C 370 152 304 156 256 182 Z" 
          fill="#FAF8F5" />

    <!-- Capa interior de páginas (Efecto de hojas superpuestas) -->
    <path d="M 256 348 C 210 332 152 328 102 342 L 102 195 C 150 182 210 186 256 206 Z" 
          fill="#F0EBE1" opacity="0.6"/>
    <path d="M 256 348 C 302 332 360 328 410 342 L 410 195 C 362 182 302 186 256 206 Z" 
          fill="#E6DFD3" opacity="0.6"/>

    <!-- Lomo central / Sombra del pliegue -->
    <path d="M 254 182 L 254 362 C 255.3 362.5 256.7 362.5 258 362 L 258 182 Z" 
          fill="#D6CDBD" />

    <!-- Cinta marcapáginas (30% Terracota #DE7272) cayendo desde el centro superior -->
    <path d="M 242 165 L 270 165 L 270 295 L 256 278 L 242 295 Z" 
          fill="url(#ribbonGradient)" />

    <!-- Destello cultural / Estrella en la esquina superior (10% Verde salvia / dorado) -->
    <path d="M 390 120 C 390 138 376 152 358 152 C 376 152 390 166 390 184 C 390 166 404 152 422 152 C 404 152 390 138 390 120 Z" 
          fill="url(#accentGradient)" />
    
    <!-- Pequeño destello secundario blanco -->
    <path d="M 330 110 C 330 118 322 124 314 124 C 322 124 330 130 330 138 C 330 130 338 124 346 124 C 338 124 330 118 330 110 Z" 
          fill="#FFFFFF" opacity="0.85"/>
  </g>
</svg>
